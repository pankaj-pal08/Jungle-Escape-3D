<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Run 3D Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">
        <div>🏆 SCORE: <span id="score">0</span></div>
        <div>🪙 COINS: <span id="coins">0</span></div>
    </div>

    <div id="menu">
        <h1>TEMPLE RUN</h1>
        <h2>JUNGLE ADVENTURE</h2>
        <p>Escape from the Ancient Temple!</p>
        <button id="startBtn">START RUN</button>
        <p class="controls">← → Move | ↑ Jump | ↓ Slide</p>
    </div>

    <div id="mobileControls">
        <button data-key="left">◀</button>
        <button data-key="jump">▲</button>
        <button data-key="slide">▼</button>
        <button data-key="right">▶</button>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
